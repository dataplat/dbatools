version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # claude-code-action ships a patch release almost daily; only take minor and major bumps
      - dependency-name: "anthropics/claude-code-action"
        update-types:
          - "version-update:semver-patch"
    open-pull-requests-limit: 5
