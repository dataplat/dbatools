name: Check repo size
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: reposize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v1
      - uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1
        id: findpr
        with:
          state: all

      - name: Repository size should be less than 125480 KiB
        env:
          PR: ${{ steps.findpr.outputs.pr }}
        shell: pwsh
        run: |
          cd /tmp
          # Only development: a clone of every branch also counts branches that have nothing to do with this pull request
          gh repo clone dataplat/dbatools -- --single-branch --branch development
          cd /tmp/dbatools
          # gh pr checkout fetches only the branch of the pull request, but it can track that branch only when the fetch
          # refspec of the clone covers it, which the clone of one branch narrowed to development
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          Write-Output "Checking out $env:PR"
          gh pr checkout $env:PR
          # Without the pull request the step would measure development alone and pass
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out pull request $env:PR"
          }
          $objects = git count-objects -v
          $sizepack = $objects | Where-Object { $PSItem -match "size-pack" }
          $size = [int]($sizepack -split " " | Select-Object -Last 1)
          Write-Output "Repo size is $size"
          # old size = 110299 or 250000+
          if ($size -gt 125480) { # Size is 96250, so 125480 keeps headroom while catching old clones
            throw "This clone is outdated. Please reclone your repo and resubmit with the slimmed down repo. See https://github.com/dataplat/dbatools/pull/8637 for more information."
          }
