name: Run Cross Platform Tests
on:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - '**/*.json'
      - 'docs/**'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.aider/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'bin/**'
      - 'en-us/**'
      - '!.github/dbatools-library-version.json'
      - '!bin/dbatools-buildref-index.json'
      - '!bin/dbatools-sqlinstallationcomponents.json'
defaults:
  run:
    shell: pwsh

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  # Core tests touch shared Azure resources and must finish their cleanup.
  cancel-in-progress: false

jobs:
  linux-tests:
    env:
        SMODefaultModuleName: dbatools
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read dbatools.library version
        id: get-version
        shell: pwsh
        run: |
          $versionConfig = Get-Content '.github/dbatools-library-version.json' | ConvertFrom-Json
          $version = $versionConfig.version
          $isPreview = $version -like "*preview*"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "is_preview=$isPreview" >> $env:GITHUB_OUTPUT
          Write-Output "Using dbatools.library version: $version"
          Write-Output "Is preview version: $isPreview"

      - name: Install dbatools.library (stable versions)
        if: steps.get-version.outputs.is_preview == 'False'
        run: |
          Write-Output "Stable version detected, bypassing PSModuleCache in this secret-bearing job"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1

      - name: Install dbatools.library (preview versions)
        if: steps.get-version.outputs.is_preview == 'True'
        shell: pwsh
        run: |
          Write-Output "Preview version detected, bypassing PSModuleCache and using install script"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1

      - name: Set encryption values
        run: |
          Import-Module ./dbatools.psd1 -Force
          Get-Module dbatools.library | Select-Object -ExpandProperty Path -OutVariable lib | Write-Warning
          Set-DbatoolsConfig -FullName sql.connection.trustcert -Value $true -Register
          Set-DbatoolsConfig -FullName sql.connection.encrypt -Value $false -Register
          Get-DbatoolsConfigValue -FullName sql.connection.encrypt | Write-Warning
          mkdir /tmp/DbatoolsExport

      - name:  Setup docker images
        run: |
          # create a shared network
          docker network create localnet
          # Expose engine and endpoint then setup a shared path for migrations
          docker run -p 1433:1433  --volume shared:/shared:z --name mssql1 --hostname mssql1 --network localnet -e MSSQL_MEMORY_LIMIT_MB=1536 -d dbatools/sqlinstance
          # Expose second engine and endpoint on different port
          docker run -p 14333:1433 --volume shared:/shared:z --name mssql2 --hostname mssql2 --network localnet -e MSSQL_MEMORY_LIMIT_MB=1536 -d dbatools/sqlinstance2
          # Expose a third engine for testing multiple log-shipping secondaries
          docker run -p 14334:1433 --volume shared:/shared:z --name mssql3 --hostname mssql3 --network localnet -e MSSQL_MEMORY_LIMIT_MB=1024 -d dbatools/sqlinstance2

      - name: Wait for the SQL Server containers to be ready
        run: |
          # The containers start detached and nothing waited for them, so the first test that needed the second
          # instance failed whenever it was still starting (#10590). A login is not enough for the mirroring test:
          # the mirroring endpoint on mssql2 has to be listening as well, so every instance is polled until it
          # accepts a login and every mirroring endpoint it has reports STARTED (state 0 in sys.endpoints).
          Import-Module ./dbatools.psd1 -Force
          $password = ConvertTo-SecureString "dbatools.IO" -AsPlainText -Force
          $cred = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList "sqladmin", $password
          foreach ($instance in "localhost", "localhost:14333", "localhost:14334") {
              $ready = $false
              foreach ($attempt in 1..36) {
                  try {
                      $server = Connect-DbaInstance -SqlInstance $instance -SqlCredential $cred -TrustServerCertificate
                      $endpointsNotStarted = $server.Query("SELECT name FROM sys.database_mirroring_endpoints WHERE state <> 0")
                      if (-not $endpointsNotStarted) {
                          Write-Host "$instance is ready (version $($server.VersionString))"
                          $ready = $true
                          break
                      }
                      Write-Host "Attempt $attempt of 36: $instance accepts logins, but its mirroring endpoint has not started yet"
                  } catch {
                      Write-Host "Attempt $attempt of 36: $instance is not ready yet ($($PSItem.Exception.Message))"
                  }
                  Start-Sleep -Seconds 5
              }
              if (-not $ready) {
                  throw "$instance did not become ready in time"
              }
          }

      - name: 👥 Clone appveyor repo
        working-directory: /tmp
        run: |
          gh repo clone dataplat/appveyor-lab

      - name: Install SqlPackage
        shell: pwsh
        run: |
          Import-Module ./dbatools.psd1 -Force
          Install-DbaSqlPackage -Force -Verbose

      - name: Install Pester 6
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run core integration tests
        env:
          TENANTID: ${{secrets.TENANTID}}
          CLIENTID: ${{secrets.CLIENTID}}
          CLIENTSECRET: ${{secrets.CLIENTSECRET}}
          CLIENT_GUID: ${{secrets.CLIENT_GUID}}
          CLIENT_GUID_SECRET: ${{secrets.CLIENT_GUID_SECRET}}
          azurepasswd: ${{secrets.AZUREPASSWD}}
          azurelegacypasswd: ${{secrets.AZURELEGACYPASSWD}}
        run: |
          Import-Module Pester -RequiredVersion 6.0.0 -Force
          Import-Module ./dbatools.psd1 -Force
          $TestConfig = & (Get-Module dbatools) { Get-TestConfig }
          Get-DbatoolsConfigValue -FullName sql.connection.trustcert | Write-Warning
          Get-DbatoolsConfigValue -FullName sql.connection.encrypt | Write-Warning
          $splatCorePester = @{
              Path     = ".github/scripts/gh-actions.ps1"
              Output   = "Detailed"
              PassThru = $true
          }
          $coreResult = Invoke-Pester @splatCorePester
          if ($coreResult.Result -ne "Passed" -or $coreResult.FailedCount -gt 0) {
              throw "Core integration tests failed with result $($coreResult.Result) and $($coreResult.FailedCount) failed test(s)."
          }

  windows-tests:
    # disabled 2026-07-14: hangs too much on windows-latest hosted runners
    if: false
    env:
        SMODefaultModuleName: dbatools
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dbatools repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read dbatools.library version
        id: get-version
        shell: pwsh
        run: |
          $versionConfig = Get-Content '.github/dbatools-library-version.json' | ConvertFrom-Json
          $version = $versionConfig.version
          $isPreview = $version -like "*preview*"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "is_preview=$isPreview" >> $env:GITHUB_OUTPUT
          Write-Output "Using dbatools.library version: $version"
          Write-Output "Is preview version: $isPreview"

      - name: Install dbatools.library for Windows PowerShell (stable versions)
        if: steps.get-version.outputs.is_preview == 'False'
        shell: powershell
        run: |
          Write-Output "Stable version detected, bypassing PSModuleCache in this secret-bearing job"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1 -Scope AllUsers

      - name: Install dbatools.library for PowerShell 7 (stable versions)
        if: steps.get-version.outputs.is_preview == 'False'
        shell: pwsh
        run: |
          Write-Output "Stable version detected, bypassing PSModuleCache in this secret-bearing job"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1 -Scope AllUsers

      - name: Install dbatools.library (preview versions)
        if: steps.get-version.outputs.is_preview == 'True'
        shell: pwsh
        run: |
          Write-Output "Preview version detected, bypassing PSModuleCache and using install script"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1 -Scope AllUsers

      - name: Install SQL Server engine and localdb
        uses: potatoqualitee/mssqlsuite@2291d923e83859edd871679c05b379037376761f # v1.12
        with:
          install: localdb, sqlengine

      - name: Connect to localdb instance powershell
        shell: powershell
        run: |
          $env:PSModulePath -split ";" | Write-Warning
          Import-Module ./dbatools -Force
          (Get-Module dbatools.library).Path | Write-Warning
          Set-DbatoolsConfig -FullName sql.connection.trustcert -Value $true -PassThru | Register-DbatoolsConfig -Scope FileUserShared
          Set-DbatoolsConfig -FullName sql.connection.encrypt -Value $false -PassThru | Register-DbatoolsConfig -Scope FileUserShared
          Write-Host "Connecting to SQL Server instance (localdb)\MSSQLLocalDB..."
          Connect-DbaInstance -SqlInstance "(localdb)\MSSQLLocalDB"

      - name: Connect to SQL Server instance pwsh
        shell: pwsh
        run: |
          Import-Module ./dbatools -Force
          Set-DbatoolsConfig -FullName sql.connection.trustcert -Value $true -PassThru | Register-DbatoolsConfig -Scope FileUserShared
          Set-DbatoolsConfig -FullName sql.connection.encrypt -Value $false -PassThru | Register-DbatoolsConfig -Scope FileUserShared

          $password = ConvertTo-SecureString "dbatools.I0" -AsPlainText -Force
          $cred = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList "sa", $password
          $PSDefaultParameterValues["*:SqlInstance"] = "localhost"
          $PSDefaultParameterValues["*:SqlCredential"] = $cred
          Connect-DbaInstance

      - name: Install SqlPackage
        shell: pwsh
        run: |
          Import-Module ./dbatools.psd1 -Force
          Install-DbaSqlPackage -Force -Verbose

      - name: Run PowerShell tests
        env:
          TENANTID: ${{secrets.TENANTID}}
          CLIENTID: ${{secrets.CLIENTID}}
          CLIENTSECRET: ${{secrets.CLIENTSECRET}}
        shell: powershell
        run: $null = Invoke-Pester .github/scripts/gh-winactions.ps1 -Output Detailed -PassThru

      - name: Run pwsh tests
        env:
          TENANTID: ${{secrets.TENANTID}}
          CLIENTID: ${{secrets.CLIENTID}}
          CLIENTSECRET: ${{secrets.CLIENTSECRET}}
          CLIENT_GUID: ${{secrets.CLIENT_GUID}}
          CLIENT_GUID_SECRET: ${{secrets.CLIENT_GUID_SECRET}}
        shell: pwsh
        run: $null = Invoke-Pester .github/scripts/gh-winactions.ps1 -Output Detailed -PassThru

  macos-tests:
    env:
        SMODefaultModuleName: dbatools
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dbatools repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read dbatools.library version
        id: get-version
        shell: pwsh
        run: |
          $versionConfig = Get-Content '.github/dbatools-library-version.json' | ConvertFrom-Json
          $version = $versionConfig.version
          $isPreview = $version -like "*preview*"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "is_preview=$isPreview" >> $env:GITHUB_OUTPUT
          Write-Output "Using dbatools.library version: $version"
          Write-Output "Is preview version: $isPreview"

      - name: Install dbatools.library (stable versions)
        if: steps.get-version.outputs.is_preview == 'False'
        run: |
          Write-Output "Stable version detected, bypassing PSModuleCache in this secret-bearing job"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1

      - name: Install dbatools.library (preview versions)
        if: steps.get-version.outputs.is_preview == 'True'
        shell: pwsh
        run: |
          Write-Output "Preview version detected, bypassing PSModuleCache and using install script"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1

      - name: 👥 Clone appveyor repo
        working-directory: /tmp
        run: |
          gh repo clone dataplat/appveyor-lab

      - name: Install SqlPackage
        shell: pwsh
        run: |
          Import-Module ./dbatools.psd1 -Force
          Install-DbaSqlPackage -Force -Verbose

      - name: Run macOS tests
        env:
          TENANTID: ${{secrets.TENANTID}}
          CLIENTID: ${{secrets.CLIENTID}}
          CLIENTSECRET: ${{secrets.CLIENTSECRET}}
          CLIENT_GUID: ${{secrets.CLIENT_GUID}}
          CLIENT_GUID_SECRET: ${{secrets.CLIENT_GUID_SECRET}}
        shell: pwsh
        run: |
          $null = Import-Module ./dbatools.psd1 -Force
          $null = Set-DbatoolsInsecureConnection
          $null = Invoke-Pester .github/scripts/gh-macactions.ps1 -Output Detailed -PassThru
