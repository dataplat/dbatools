name: Run Azure Migration Tests
on:
  push:
    branches-ignore:
      - master
    tags-ignore:
      - '**'
    paths:
      - 'public/Start-DbaAzMigration.ps1'
      - 'public/Export-DbaDacPackage.ps1'
      - 'public/Publish-DbaDacPackage.ps1'
      - 'public/New-DbaDacOption.ps1'
      - 'private/functions/Invoke-DbaAzMigrationCallback.ps1'
      - 'private/functions/New-DbaDacService.ps1'
      - 'private/functions/Test-DbaAccessToken.ps1'
      - 'private/functions/utility/Hide-ConnectionString.ps1'
      - '.github/scripts/gh-azmigration-actions.ps1'
      - '.github/scripts/install-dbatools-library.ps1'
      - '.github/dbatools-library-version.json'
      - '.github/workflows/azure-migration-tests.yml'

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

concurrency:
  group: azure-migration-tests-${{ github.ref }}
  # Azure tests own temporary databases until their AfterAll cleanup completes.
  cancel-in-progress: false

jobs:
  azure-migration-tests:
    # GitHub withholds repository secrets from Dependabot-triggered runs, so azure/login
    # sees an empty VMSS_AZURE_CREDENTIALS and hard-fails. This file is one of the trigger
    # paths above, so every Dependabot bump of an action used here would otherwise go red.
    if: github.actor != 'dependabot[bot]'
    env:
      SMODefaultModuleName: dbatools
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dbatools.library
        run: |
          Write-Output "Bypassing PSModuleCache in this secret-bearing job"
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          ./.github/scripts/install-dbatools-library.ps1

      - name: Set encryption values
        run: |
          Import-Module ./dbatools.psd1 -Force
          Get-Module dbatools.library | Select-Object -ExpandProperty Path -OutVariable lib | Write-Warning
          $splatTrustCertificateConfig = @{
              FullName = "sql.connection.trustcert"
              Value    = $true
              Register = $true
          }
          Set-DbatoolsConfig @splatTrustCertificateConfig
          $splatEncryptionConfig = @{
              FullName = "sql.connection.encrypt"
              Value    = $false
              Register = $true
          }
          Set-DbatoolsConfig @splatEncryptionConfig
          Get-DbatoolsConfigValue -FullName sql.connection.encrypt | Write-Warning
          $splatExportDirectory = @{
              Path     = "/tmp/DbatoolsExport"
              ItemType = "Directory"
              Force    = $true
          }
          $null = New-Item @splatExportDirectory

      - name: Set up SQL Server source
        run: |
          docker network create localnet
          docker run -p 1433:1433 --volume shared:/shared:z --name mssql1 --hostname mssql1 --network localnet -e MSSQL_MEMORY_LIMIT_MB=1536 -d dbatools/sqlinstance

      - name: Wait for SQL Server source
        run: |
          Import-Module ./dbatools.psd1 -Force
          $sourcePassword = New-Object System.Security.SecureString
          foreach ($sourcePasswordCharacter in "dbatools.IO".ToCharArray()) {
              $sourcePassword.AppendChar($sourcePasswordCharacter)
          }
          $sourcePassword.MakeReadOnly()
          $sourceCredential = New-Object -TypeName System.Management.Automation.PSCredential -ArgumentList "sqladmin", $sourcePassword
          $sourceReady = $false
          $lastSourceReadinessError = "No connection attempt completed."
          for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                  $splatSourceReadinessConnection = @{
                      SqlInstance   = "localhost"
                      SqlCredential = $sourceCredential
                      Database      = "master"
                      ErrorAction   = "Stop"
                  }
                  $sourceServer = Connect-DbaInstance @splatSourceReadinessConnection
                  $null = Disconnect-DbaInstance -InputObject $sourceServer
                  $sourceReady = $true
                  break
              } catch {
                  $lastSourceReadinessError = $PSItem.Exception.Message
                  if ($attempt -lt 30) {
                      Start-Sleep -Seconds 2
                  }
              }
          }
          if (-not $sourceReady) {
              docker logs mssql1
              throw "SQL Server source did not become ready within 60 seconds. Last probe error: $lastSourceReadinessError"
          }

      - name: Install Pester 6
        run: |
          $splatPesterInstall = @{
              Name               = "Pester"
              RequiredVersion    = "6.0.0"
              Force              = $true
              Scope              = "CurrentUser"
              SkipPublisherCheck = $true
          }
          Install-Module @splatPesterInstall

      - name: Authenticate existing Azure CI identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: ${{ secrets.VMSS_AZURE_CREDENTIALS }}

      - name: Run Azure migration integration tests
        env:
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
        run: |
          $splatPesterImport = @{
              Name            = "Pester"
              RequiredVersion = "6.0.0"
              Force           = $true
          }
          Import-Module @splatPesterImport
          Import-Module ./dbatools.psd1 -Force
          $TestConfig = & (Get-Module dbatools) { Get-TestConfig }
          Get-DbatoolsConfigValue -FullName sql.connection.trustcert | Write-Warning
          Get-DbatoolsConfigValue -FullName sql.connection.encrypt | Write-Warning
          $initialAzureTokenOutput = @(az account get-access-token --resource https://database.windows.net/ --query accessToken --output tsv)
          $env:AZMIGRATION_ACCESS_TOKEN = ([string]($initialAzureTokenOutput -join "")).Trim()
          if (-not $env:AZMIGRATION_ACCESS_TOKEN) {
              throw "The authenticated Azure CLI session did not return an Azure SQL access token."
          }
          $splatAzurePester = @{
              Path     = ".github/scripts/gh-azmigration-actions.ps1"
              Output   = "Detailed"
              PassThru = $true
          }
          $azureResult = Invoke-Pester @splatAzurePester
          if ($azureResult.Result -ne "Passed" -or $azureResult.FailedCount -gt 0) {
              throw "Azure migration integration tests failed with result $($azureResult.Result) and $($azureResult.FailedCount) failed test(s)."
          }
